<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>All Things Tyler · Directory Admin</title>
<style>
:root{font-family:Arial,sans-serif;color:#193d64;background:#f5f6f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:40px auto;padding:0 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#a47b3d;font-weight:700}.panel,.listing{background:#fff;border:1px solid #e3e8ec;border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:28px;font-weight:700}.muted{color:#718092;font-size:12px;line-height:1.5}input{width:100%;padding:12px;border:1px solid #ccd5dd;border-radius:8px;margin:8px 0 12px}button{border:1px solid #cbd5df;border-radius:8px;background:#fff;padding:9px 12px;color:#193d64;cursor:pointer;font-weight:600}button.primary{background:#193d64;color:white;border-color:#193d64}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pill{display:inline-block;background:#edf1f5;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700}.warn{background:#fff1df;color:#85581d}.ok{background:#e7f3eb;color:#286342}.listing h3{font:500 20px Georgia,serif;margin:0 0 6px}.listing p{margin:6px 0}.tags{font-size:11px;color:#647386;line-height:1.7}.hidden{display:none}.error{color:#a52b2b}.success{color:#23623e}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.listing .row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="head"><div><p class="eyebrow">ALL THINGS TYLER · PRIVATE ADMIN</p><h1>Directory management</h1><p><a href="/category-review.html">Review service categories →</a></p><p class="muted">Review imported member records before approving or publishing. Billing-method presence is not proof of successful payment.</p></div><button id="logout" class="hidden">Sign out</button></header>
<section id="login" class="panel"><h2>Admin access</h2><label for="token">Admin access token</label><input id="token" type="password" autocomplete="current-password" placeholder="Enter private admin token"><button id="loginBtn" class="primary">Sign in</button><p id="loginError" class="error" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="grid" id="metrics"></div><div class="panel"><div class="row"><div><h2>Imported businesses</h2><p class="muted">Review and edit records before approving or publishing.</p></div><input id="search" type="search" placeholder="Search business, city, category…" style="max-width:280px"><select id="filter"><option value="all">All listings</option><option value="staged">Needs listing review</option><option value="billing">Billing review needed</option><option value="missing_website">Missing website</option><option value="missing_city">Missing city</option><option value="approved">Approved</option><option value="published">Published</option></select></div></div><div id="listings"></div></section>
<p id="message" role="status" class="muted"></p></main>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('aty-admin-token')||'',items=[];
function auth(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'};}
async function load(){const r=await fetch('/api/admin/listings',{headers:auth()});if(!r.ok)throw Error((await r.json()).error||'Unable to load records');const d=await r.json();items=d.listings;const s=d.summary;$('metrics').innerHTML=[['Total',s.total],['Staged',s.staged],['Approved',s.approved],['Published',s.published],['Billing review',s.billing_review]].map(([k,v])=>'<div class="panel"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>').join('');render();}
function render(){const f=$('filter').value,q=$('search').value.trim().toLowerCase();const rows=items.filter(x=>(f==='all'||(f==='billing'?x.billing_status==='needs_review':f==='missing_website'?!x.website_url:f==='missing_city'?!x.city:x.publication_status===f))&&(!q||[x.business_name,x.city,x.state,...(x.category_labels||[])].filter(Boolean).join(' ').toLowerCase().includes(q)));$('listings').innerHTML=rows.map(x=>{const bill=x.billing_status==='needs_review';return '<article class="listing"><div class="row"><div><h3>'+esc(x.business_name)+'</h3><p class="muted">'+esc([x.city,x.state].filter(Boolean).join(', '))+' · '+esc(x.membership_tier)+' · '+esc(x.billing_period)+'</p></div><div><span class="pill">'+esc(x.publication_status.toUpperCase())+'</span> <span class="pill '+(bill?'warn':'ok')+'">'+(bill?'BILLING REVIEW':'METHOD ON FILE')+'</span></div></div><p class="muted">'+esc(x.tagline||x.description||'No description supplied')+'</p><p class="tags">'+esc((x.category_labels||[]).join(' · '))+'</p><p class="muted">'+esc(x.business_phone||'')+' '+esc(x.business_email||'')+'</p><details class="panel"><summary>Edit business details</summary><form data-edit-id="'+x.id+'"><label>Business name<input name="business_name" required maxlength="500" value="'+esc(x.business_name)+'"></label><label>Tagline<input name="tagline" maxlength="300" value="'+esc(x.tagline||'')+'"></label><label>Description<textarea name="description" rows="3" maxlength="5000">'+esc(x.description||'')+'</textarea></label><div class="grid"><label>City<input name="city" value="'+esc(x.city||'')+'"></label><label>State<input name="state" value="'+esc(x.state||'')+'"></label><label>Postal code<input name="postal_code" value="'+esc(x.postal_code||'')+'"></label><label>Website<input name="website_url" value="'+esc(x.website_url||'')+'"></label><label>Phone<input name="business_phone" value="'+esc(x.business_phone||'')+'"></label><label>Email<input name="business_email" value="'+esc(x.business_email||'')+'"></label></div><label>Service categories (one per line)<textarea name="category_labels" rows="3">'+esc((x.category_labels||[]).join('\n'))+'</textarea></label><label>Logo URL<input name="logo_url" value="'+esc(x.logo_url||'')+'"></label><label>Google review URL<input name="google_review_url" value="'+esc(x.google_review_url||'')+'"></label><label>Gallery image URLs (one per line)<textarea name="gallery_urls" rows="3">'+esc((x.gallery_urls||[]).join('\n'))+'</textarea></label><label>Street address<input name="street_address" value="'+esc(x.street_address||'')+'"></label><label><input type="checkbox" name="show_street_address" '+(x.show_street_address?'checked':'')+'> Show street address publicly</label><label><input type="checkbox" name="hide_contact_name" '+(x.hide_contact_name?'checked':'')+'> Hide contact name</label><div class="actions"><button class="primary" type="submit">Save details</button></div></form></details><div class="actions"><button data-id="'+x.id+'" data-status="approved" '+(x.publication_status==='approved'||x.publication_status==='published'?'disabled':'')+'>Approve listing</button><button class="primary" data-id="'+x.id+'" data-status="published" '+(x.publication_status!=='approved'||bill?'disabled':'')+'>Publish</button><button data-id="'+x.id+'" data-status="suspended" '+(x.publication_status==='suspended'?'disabled':'')+'>Suspend</button></div>'+(bill?'<p class="muted error">Billing method missing in export. Keep unpublished until confirmed.</p>':'')+'</article>';}).join('')||'<div class="panel">No listings match this search or filter.</div>';}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('loginBtn').onclick=async()=>{token=$('token').value.trim();try{await load();sessionStorage.setItem('aty-admin-token',token);$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');$('loginError').textContent='';}catch(e){$('loginError').textContent=e.message;token='';}};
$('logout').onclick=()=>{sessionStorage.removeItem('aty-admin-token');token='';$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');};
$('filter').onchange=render;$('search').oninput=render;
$('listings').onsubmit=async e=>{const form=e.target.closest('form[data-edit-id]');if(!form)return;e.preventDefault();const fd=new FormData(form);const fields={};for(const k of ['business_name','tagline','description','city','state','postal_code','website_url','business_phone','business_email','logo_url','google_review_url','street_address'])fields[k]=String(fd.get(k)||'').trim()||null;fields.category_labels=String(fd.get('category_labels')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);fields.gallery_urls=String(fd.get('gallery_urls')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);fields.show_street_address=form.elements.show_street_address.checked;fields.hide_contact_name=form.elements.hide_contact_name.checked;const btn=form.querySelector('button[type=submit]');btn.disabled=true;try{const r=await fetch('/api/admin/listings',{method:'PATCH',headers:auth(),body:JSON.stringify({id:form.dataset.editId,fields})});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');await load();$('message').textContent='Saved business details.';}catch(err){$('message').textContent=err.message;btn.disabled=false;}};
$('listings').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;b.disabled=true;try{const r=await fetch('/api/admin/listings',{method:'PATCH',headers:auth(),body:JSON.stringify({id:b.dataset.id,publication_status:b.dataset.status})});const d=await r.json();if(!r.ok)throw Error(d.error||'Update failed');await load();$('message').textContent='Updated '+(d.listing?.publication_status||'listing')+'.';}catch(err){$('message').textContent=err.message;b.disabled=false;}};
if(token){$('token').value='';load().then(()=>{$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');}).catch(()=>{sessionStorage.removeItem('aty-admin-token');token='';});}
</script></body></html>
