<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>All Things Tyler · Category Review</title><style>
:root{font-family:Arial,sans-serif;color:#193d64;background:#f5f6f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:36px auto;padding:0 18px}.panel,.item{background:white;border:1px solid #e1e6eb;border-radius:12px;padding:18px;margin:12px 0}.muted{color:#718092;font-size:12px;line-height:1.5}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#a47b3d;font-weight:bold}input,select{padding:10px;border:1px solid #ccd5dd;border-radius:7px;margin:6px 0;width:100%}button{padding:9px 12px;border:1px solid #ccd5dd;border-radius:7px;background:white;color:#193d64;font-weight:bold;cursor:pointer}.primary{background:#193d64;color:white}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{font-size:24px;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.item h3{font:500 17px Georgia,serif;margin:0}.pill{font-size:10px;background:#edf1f5;padding:5px 8px;border-radius:30px}.error{color:#a22}.success{color:#286342}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><p class="eyebrow">ALL THINGS TYLER · PRIVATE ADMIN</p><h1>Service category review</h1><p class="muted">Review each member-provided service label and assign it to a supported top-level directory section. This does not publish businesses or change membership billing.</p>
<section id="login" class="panel"><h2>Admin access</h2><input id="token" type="password" autocomplete="current-password" placeholder="Admin access token"><button id="loginBtn" class="primary">Sign in</button><p id="err" class="error"></p></section>
<section id="app" class="hidden"><div id="metrics" class="grid"></div><div class="panel"><div class="row"><input id="search" placeholder="Search service labels…" style="max-width:340px"><select id="filter" style="max-width:220px"><option value="pending">Pending review</option><option value="needs_custom">Needs custom category</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="all">All categories</option></select></div></div><div id="items"></div></section><p id="msg" class="muted" role="status"></p></main>
<script>
const $=id=>document.getElementById(id);let token='',items=[],parents=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={home:'Home Services',realestate:'Homes & Real Estate',professional:'Professional',health:'Health, Beauty & Wellness',family:'Family & Education',food:'Food & Drink',automotive:'Automotive',transport:'Transportation & Lodging',pets:'Pets',media:'Photography & Media',occasions:'Events',retail:'Retail, Specialty & Supply'};
async function load(){const r=await fetch('/api/admin/categories',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load categories');items=d.categories;parents=d.allowed_parents;render(d.summary);}
function render(s){$('metrics').innerHTML=[['Total',s.total],['Pending',s.pending],['Approved',s.approved],['Needs custom',s.needs_custom]].map(([k,v])=>'<div class="panel"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>').join('');const q=$('search').value.toLowerCase(),f=$('filter').value;const rows=items.filter(x=>(f==='all'||x.review_status===f)&&x.source_label.toLowerCase().includes(q));$('items').innerHTML=rows.map(x=>'<article class="item"><div class="row"><div><h3>'+esc(x.source_label)+'</h3><p class="muted">'+x.listing_count+' member listings use this label</p></div><span class="pill">'+esc(x.review_status.toUpperCase())+'</span></div><label class="muted">Directory section</label><select id="parent-'+x.id+'"><option value="">Choose section</option>'+parents.map(p=>'<option value="'+p+'" '+(x.approved_parent===p?'selected':'')+'>'+names[p]+'</option>').join('')+'</select><div class="actions"><button class="primary" data-id="'+x.id+'" data-status="approved">Approve mapping</button><button data-id="'+x.id+'" data-status="needs_custom">Needs custom category</button><button data-id="'+x.id+'" data-status="rejected">Reject label</button><button data-id="'+x.id+'" data-status="pending">Reset</button></div></article>').join('')||'<div class="panel">No categories match this filter.</div>';}
$('loginBtn').onclick=async()=>{token=$('token').value.trim();try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('err').textContent='';}catch(e){token='';$('err').textContent=e.message;}};
$('items').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const status=b.dataset.status,parent=$('parent-'+b.dataset.id)?.value||null;if(status==='approved'&&!parent){$('msg').textContent='Choose a directory section before approving.';return;}b.disabled=true;try{const r=await fetch('/api/admin/categories',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,review_status:status,approved_parent:parent})});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');await load();$('msg').textContent='Saved category review.';}catch(err){$('msg').textContent=err.message;b.disabled=false;}};
$('search').oninput=()=>render({total:items.length,pending:items.filter(x=>x.review_status==='pending').length,approved:items.filter(x=>x.review_status==='approved').length,needs_custom:items.filter(x=>x.review_status==='needs_custom').length});
$('filter').onchange=()=>render({total:items.length,pending:items.filter(x=>x.review_status==='pending').length,approved:items.filter(x=>x.review_status==='approved').length,needs_custom:items.filter(x=>x.review_status==='needs_custom').length});
</script></body></html>
